[project]
name = "supply-chain-decision-platform"
version = "0.1.0"
description = "Retail demand forecasting, inventory optimisation and supply chain simulation on M5"
readme = "README.md"
authors = [
    { name = "vitorneve-s7", email = "vitor.neves200499@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlforecast>=1.0.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "simpy>=4.1.2",
    "statsforecast>=2.0.1",
    "streamlit>=1.66.1",
    "utilsforecast>=0.2.17",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # imports after sys.path.append

[tool.pytest.ini_options]
pythonpath = ["."]
